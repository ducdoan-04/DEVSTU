[package]
name = "DEVSTU"
version = "1.0.0"
description = "DEVSTU AI Photo Retouching Suite"
authors = ["ducdoan-04 <ducdoan04.work@gmail.com>"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "devstu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "DEVSTU"
path = "src/main.rs"

[[bin]]
name = "aipic_bridge"
path = "src/bin/aipic_bridge.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22"
image = "0.25"
rayon = "1.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tiny_http = "0.12.0"
url = "2.5.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
